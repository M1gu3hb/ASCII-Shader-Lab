<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Shader Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --panel:rgba(244,246,250,.92); --panel-solid:#f4f6fa; --text:#141b2b; --muted:#566174;
  --line:rgba(20,27,43,.13); --field:rgba(20,27,43,.06); --accent:#b25f00; --accent-ink:#ffffff;
  --rec:#d0342c;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:rgba(11,19,33,.86); --panel-solid:#0b1321; --text:#e8edf5; --muted:#93a0b6;
    --line:rgba(232,237,245,.12); --field:rgba(232,237,245,.07); --accent:#ffb547; --accent-ink:#1d1200;
    --rec:#ff5a4f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:rgba(11,19,33,.86); --panel-solid:#0b1321; --text:#e8edf5; --muted:#93a0b6;
  --line:rgba(232,237,245,.12); --field:rgba(232,237,245,.07); --accent:#ffb547; --accent-ink:#1d1200;
  --rec:#ff5a4f; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#05060a;color:var(--text);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#stage{position:fixed;inset:0;background:#05060a}
#cv{display:block;width:100%;height:100%;touch-action:none}
body.dragging #stage::after{content:"";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:16px;pointer-events:none}

.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;pointer-events:none}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:10px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.brand strong{font:600 14px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:-.01em;white-space:nowrap}
#stats{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.ib{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;font-weight:500;white-space:nowrap}
.ib:hover{border-color:var(--accent)}
.ib svg{width:17px;height:17px;flex:none}

#panel{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 62px);right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:348px;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);
  border:1px solid var(--line);border-radius:16px;overflow:hidden}
body.panel-off #panel{display:none}
.presets{display:flex;gap:6px;overflow-x:auto;padding:12px 12px 10px;scrollbar-width:none;flex:none}
.presets::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tabs{display:flex;padding:0 6px;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;padding:10px 2px 9px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-weight:500;font-size:13px}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.panes{flex:1;overflow-y:auto;padding:14px 14px 22px;overscroll-behavior:contain}

.ctl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;margin:0 0 13px}
.ctl .lbl{font-size:13px;color:var(--muted)}
.ctl output{font:500 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--text);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:var(--accent);height:20px}
.ctl select,.ctl textarea,.ctl input[type=text]{grid-column:1/-1;width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ctl textarea{resize:vertical;min-height:64px}
.ctl input[type=text]{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px}
select option{background:var(--panel-solid);color:var(--text)}
.ctl.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.ctl.color .sw{display:flex;align-items:center;gap:8px}
.ctl.color input{width:40px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.seg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px;background:var(--field);padding:3px;border-radius:10px}
.seg button{flex:1 1 auto;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.sub{font-size:13px;font-weight:600;margin:20px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
.note{font-size:12.5px;color:var(--muted);margin:-3px 0 13px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--field);cursor:pointer;font-weight:500;margin:0 0 8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.rec{background:var(--rec);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#empty{position:fixed;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;padding:20px}
body:not(.panel-off) #empty{padding-right:372px}
.card{pointer-events:auto;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);
  border-radius:14px;padding:18px;text-align:center;max-width:300px}
.card p{margin:0 0 12px}
.card .btn{margin:0}

#toast{position:fixed;z-index:9;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);max-width:min(440px,calc(100vw - 32px));
  background:var(--panel-solid);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

dialog{background:var(--panel-solid);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(680px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{font-size:16px;margin:0 0 6px}
dialog textarea{width:100%;height:min(46vh,420px);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;
  font:12px/1.5 "IBM Plex Mono",ui-monospace,monospace;resize:vertical;margin:4px 0 12px}
.dlgrow{display:flex;gap:8px;flex-wrap:wrap}
.dlgrow .btn{width:auto;flex:1;margin:0}

@media (max-width:760px){
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:min(50vh,470px);border-radius:18px 18px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  body:not(.panel-off) #empty{padding-right:20px;padding-bottom:min(50vh,470px)}
  .ib span{display:none}
  .ib{padding:0 10px}
}
@media (max-width:430px){ #stats{display:none} }
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>
</head>
<body>
<main id="stage"><canvas id="cv" role="img" aria-label="Vista previa del fondo ASCII"></canvas></main>

<header class="bar">
  <div class="brand"><strong>ASCII Shader Lab</strong><span id="stats"></span></div>
  <div class="spacer"></div>
  <button class="ib" id="bRand" type="button" title="Combinación aleatoria (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span>Aleatorio</span></button>
  <button class="ib" id="bPause" type="button" title="Pausar animación (Espacio)"></button>
  <button class="ib" id="bPanel" type="button" title="Mostrar u ocultar panel (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="17" cy="6" r="2"/><circle cx="14" cy="18" r="2"/></svg><span>Panel</span></button>
  <button class="ib" id="bFull" type="button" title="Pantalla completa (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Pantalla completa</span></button>
</header>

<aside id="panel" aria-label="Controles">
  <div class="presets" id="presets" role="group" aria-label="Estilos listos"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="panes" id="panes"></div>
</aside>

<div id="empty" hidden><div class="card"><p id="emptyMsg"></p><button class="btn primary" id="emptyBtn" type="button"></button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" hidden>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <p class="note" id="dlgNote"></p>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <div class="dlgrow">
    <button class="btn primary" id="dlgCopy" type="button">Copiar</button>
    <button class="btn" id="dlgAlt" type="button"></button>
    <button class="btn" id="dlgClose" type="button">Cerrar</button>
  </div>
</dialog>

<script>
/* ====================== Motor ASCII (autónomo, se exporta tal cual) ====================== */
function ASCIIEngine(canvas, init, hooks){
  hooks = hooks || {};
  var DEF = {source:'pattern', patA:0, patB:-1, blend:0, mix:.5, scale:1, scaleB:1, speed:1, speedB:1, rot:0, warp:0, mouse:.4,
    mediaBlend:2, mediaMix:0, fit:0, zoom:1, panX:0, panY:0, mirror:false, text:'MORPHIQ', textSize:1,
    cell:10, aspect:1.4, dpr:1.5, charset:' .:-=+*#%@', sortDensity:true, font:'mono', weight:500, glyph:1,
    bright:0, contrast:1, gamma:1, invert:false, dither:0, edge:0,
    colorMode:0, colA:'#ffffff', colB:'#14142a', bg:'#05060a', sat:1, hue:0, vivid:.5, cycle:0,
    cellBg:0, glow:0, scan:0, vig:0, paused:false, mediaSrc:''};
  var FONTS = {mono:'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace',
    jetbrains:'"JetBrains Mono", monospace', plex:'"IBM Plex Mono", monospace', space:'"Space Mono", monospace',
    fira:'"Fira Code", monospace', vt:'"VT323", monospace', courier:'"Courier New", Courier, monospace'};
  var GF = {jetbrains:'JetBrains+Mono:wght@100..800', plex:'IBM+Plex+Mono:wght@100;200;300;400;500;600;700',
    space:'Space+Mono:wght@400;700', fira:'Fira+Code:wght@300..700', vt:'VT323'};
  var SANS = '"Helvetica Neue", Arial, system-ui, sans-serif';
  var S = {}, k;
  for (k in DEF) S[k] = DEF[k];
  if (init) for (k in init) if (k in DEF) S[k] = init[k];

  var gl = canvas.getContext('webgl', {antialias:false, alpha:false, premultipliedAlpha:false, preserveDrawingBuffer:false, powerPreference:'high-performance'}) || canvas.getContext('experimental-webgl');
  if (!gl) { if (hooks.onError) hooks.onError('webgl'); return null; }

  var HEAD = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';
  var LIB = `
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float h11(float x){ return fract(sin(x*127.1)*43758.5453); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),u.x), mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p; a*=.5; } return v; }
vec2 rot2(vec2 p, float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c)*p; }
float pattern(int id, vec2 p, float t){
  float v=0.;
  if(id==0){ v=fbm(p*1.8+vec2(t*.25,-t*.18)); v=smoothstep(.2,.8,v); }
  else if(id==1){ v=.5+.5*sin(p.x*6.+sin(p.y*3.2+t*.9)*1.6+t*1.4); }
  else if(id==2){ v=sin(p.x*4.+t)+sin(p.y*4.5+t*1.3)+sin((p.x+p.y)*3.+t*.7)+sin(length(p*5.+vec2(sin(t*.3),cos(t*.4)))-t*1.2); v=.5+.125*v; }
  else if(id==3){ v=.5+.5*sin(length(p)*16.-t*3.); }
  else if(id==4){ float a=atan(p.y,p.x); v=.5+.5*sin(a*3.+length(p)*12.-t*2.5); }
  else if(id==5){ float r=max(length(p),.001); float a=atan(p.y,p.x)/6.28318;
    v=.5+.5*sin(a*6.28318*6.)*sin((.35/r+t*.6)*6.28318); v*=smoothstep(0.,.45,r); }
  else if(id==6){ vec2 g=p*3.5; vec2 i=floor(g); vec2 f=fract(g); float md=8.;
    for(int y=-1;y<=1;y++){ for(int x=-1;x<=1;x++){ vec2 o=vec2(float(x),float(y));
      vec2 r=vec2(h21(i+o),h21(i+o+17.3)); r=.5+.4*sin(t*.7+6.28318*r); md=min(md,length(o+r-f)); } }
    v=clamp(md*1.15,0.,1.); }
  else if(id==7){ float c=floor(p.x*22.); float sp=.35+h11(c)*1.1; float y=p.y*.9+t*sp+h11(c+7.)*13.;
    v=pow(fract(y),5.)*step(.15,h11(c+3.1)); }
  else if(id==8){ float s=0.; for(int i=0;i<6;i++){ float fi=float(i);
      vec2 c=.65*vec2(sin(t*(.45+fi*.13)+fi*1.7),cos(t*(.38+fi*.17)+fi*2.3)); vec2 d=p-c; s+=.035/(dot(d,d)+.001); }
    v=smoothstep(.5,2.4,s); }
  else if(id==9){ v=clamp(.5+.45*p.x+.12*sin(p.y*2.+t),0.,1.); }
  else if(id==10){ v=.5+.5*sin(p.x*7.+t)*sin(p.y*7.-t*.6); }
  else if(id==11){ float a=atan(p.y,p.x); v=.5+.5*sin(a*10.+t*1.4); v*=clamp(1.15-length(p)*.6,0.,1.); }
  else if(id==12){ vec2 o=vec2(.45*sin(t*.5),.2*cos(t*.4)); v=.5+.25*(sin(length(p-o)*28.-t*2.)+sin(length(p+o)*28.-t*2.)); }
  else if(id==13){ for(int k=0;k<2;k++){ float fk=float(k); vec2 g=p*(14.+fk*9.)+vec2(0.,t*(.6+fk*.9)); vec2 i=floor(g);
      float h=h21(i+fk*31.); vec2 f=fract(g)-.5-(vec2(h21(i+3.1),h21(i+9.7))-.5)*.5;
      v+=smoothstep(.3,0.,length(f))*step(.86,h)*(.55+.45*sin(t*3.+h*60.)); }
    v=clamp(v,0.,1.); }
  else if(id==14){ float n=fbm(vec2(p.x*2.6,p.y*1.8-t*1.4)); v=clamp(n*1.5-(p.y+.35)*.9,0.,1.); }
  else { v=.5+.5*sin(max(abs(p.x),abs(p.y))*18.-t*3.); }
  return v;
}
float blendf(float a, float b, int m, float k){
  float r=b;
  if(m==1) r=a+b; else if(m==2) r=a*b; else if(m==3) r=abs(a-b); else if(m==4) r=max(a,b);
  else if(m==5) r=min(a,b); else if(m==6) r=1.-(1.-a)*(1.-b);
  else if(m==7) r=a<.5?2.*a*b:1.-2.*(1.-a)*(1.-b);
  return clamp(mix(a,r,k),0.,1.);
}`;
  var FS1 = HEAD + `
uniform vec2 uRes, uCell, uMediaSize, uPan, uMouse;
uniform float uTime, uZoom, uMirror, uMix, uScale, uScaleB, uSpeedB, uWarp, uRot, uMediaMix, uMouseAmt;
uniform int uSource, uFit, uPatA, uPatB, uBlend, uMediaBlend;
uniform sampler2D uMedia;
` + LIB + `
vec3 media(vec2 s){
  float ca=uRes.x/uRes.y; float ma=uMediaSize.x/max(uMediaSize.y,1.);
  vec2 k=vec2(1.);
  if(uFit==0){ k = ca>ma ? vec2(1.,ma/ca) : vec2(ca/ma,1.); }
  else if(uFit==1){ k = ca>ma ? vec2(ca/ma,1.) : vec2(1.,ma/ca); }
  vec2 uv=(s-.5)*k/uZoom+.5+uPan;
  if(uMirror>.5) uv.x=1.-uv.x;
  if(uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.) return vec3(0.);
  return texture2D(uMedia,uv).rgb;
}
void main(){
  vec2 px=gl_FragCoord.xy*uCell;
  vec2 p=(px-.5*uRes)/uRes.y;
  vec2 m=(uMouse-.5*uRes)/uRes.y;
  float t=uTime;
  vec2 q=rot2(p,uRot)*uScale;
  if(uWarp>0.) q+=uWarp*(vec2(fbm(q*1.2+t*.15),fbm(q*1.2+vec2(5.2,1.3)-t*.15))-.5)*2.;
  float v=pattern(uPatA,q,t);
  if(uPatB>=0){ float b=pattern(uPatB,q*uScaleB,t*uSpeedB); v=blendf(v,b,uBlend,uMix); }
  vec3 col=vec3(v); float l=v;
  if(uSource==1){
    vec2 s=px/uRes; s.y=1.-s.y;
    vec2 cs=uCell/uRes*.25;
    vec3 c=(media(s+vec2(-cs.x,-cs.y))+media(s+vec2(cs.x,-cs.y))+media(s+vec2(-cs.x,cs.y))+media(s+cs))*.25;
    col=c; float ml=dot(c,vec3(.299,.587,.114));
    l = uMediaMix>0. ? blendf(ml,v,uMediaBlend,uMediaMix) : ml;
  }
  float d=length(p-m);
  l=clamp(l+uMouseAmt*exp(-d*d*10.)*(.7+.3*sin(d*40.-t*6.)),0.,1.);
  gl_FragColor=vec4(col,l);
}`;
  var FS2 = HEAD + `
uniform vec2 uRes, uCell, uGrid, uAtlasGrid;
uniform sampler2D uData, uAtlas;
uniform float uN, uEdgeBase, uBright, uContrast, uGamma, uInvert, uDither, uEdge, uSat, uHue, uVivid, uCycle, uTime, uCellBg, uGlow, uGlyph, uScan, uVig;
uniform int uMode, uIsMedia;
uniform vec3 uColA, uColB, uBg;
float bayer2(vec2 a){ a=floor(a); return fract(dot(a,vec2(.5,a.y*.75))); }
float bayer4(vec2 a){ return bayer2(.5*a)*.25+bayer2(a); }
vec3 hueShift(vec3 c, float a){ vec3 k=vec3(.57735); float ca=cos(a); return c*ca+cross(k,c)*sin(a)+k*dot(k,c)*(1.-ca); }
float tone(float l){ l=(l-.5)*uContrast+.5+uBright; l=clamp(l,0.,1.); l=pow(l,uGamma); return mix(l,1.-l,uInvert); }
float L(vec2 c){ return tone(texture2D(uData,(c+.5)/uGrid).a); }
void main(){
  vec2 fc=gl_FragCoord.xy;
  vec2 cell=floor(fc/uCell);
  vec2 lc=fract(fc/uCell);
  vec4 d=texture2D(uData,(cell+.5)/uGrid);
  float l=tone(d.a);
  float lq=clamp(l+(bayer4(cell)-.5)*uDither/max(uN-1.,1.),0.,1.);
  float idx=floor(lq*(uN-1.)+.5);
  if(uEdge>0.){
    float tl=L(cell+vec2(-1.,1.)), tc=L(cell+vec2(0.,1.)), tr=L(cell+vec2(1.,1.));
    float ml=L(cell+vec2(-1.,0.)), mr=L(cell+vec2(1.,0.));
    float bl=L(cell+vec2(-1.,-1.)), bc=L(cell+vec2(0.,-1.)), br=L(cell+vec2(1.,-1.));
    float gx=(tr+2.*mr+br)-(tl+2.*ml+bl);
    float gy=(tl+2.*tc+tr)-(bl+2.*bc+br);
    if(length(vec2(gx,gy))>mix(2.2,.12,uEdge)){
      float a=atan(gy,gx); if(a<0.) a+=3.14159265;
      idx=uEdgeBase+mod(floor(a/.7853982+.5),4.);
    }
  }
  vec2 g=(lc-.5)/uGlyph+.5;

function hsl(h,s,l){ s/=100; l/=100; const k = n => (n+h/30)%12, a = s*Math.min(l,1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const x = v => Math.round(v*255).toString(16).padStart(2,'0'); return '#'+x(f(0))+x(f(8))+x(f(4)); }
function hiddenMount(v){ v.style.cssText = 'position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0'; document.body.appendChild(v); }

let downloadsP = null;
function getDownloads(){ if (!downloadsP) downloadsP = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null); return downloadsP; }
setTimeout(getDownloads, 0);
async function saveFile(name, data){
  const dl = await getDownloads();
  if (!dl) {
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = name; a.click(); toast('Descarga iniciada: '+name); }
    catch(e){ toast('Las descargas no están disponibles en esta vista'); }
    return;
  }
  try { await dl.save({filename:name, data}); toast('Guardado: '+name); }
  catch(e){
    const c = e && e.code;
    if (c === 'declined') toast('Descarga cancelada');
    else if (c === 'rate_limited') toast('Ya hay una descarga pendiente. Espera un momento.');
    else if (c === 'too_large') toast('El archivo es demasiado grande. Graba un clip más corto.');
    else toast('No se pudo guardar el archivo');
  }
}

/* ---------- estado ---------- */
let saveT;
function persist(){
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { const s = engine.get(); delete s.mediaSrc; s.paused = false;
    localStorage.setItem(KEY, JSON.stringify({engine:s, ui:{charsetPreset:ui.charsetPreset, videoMuted:ui.videoMuted, videoRate:ui.videoRate, tab:ui.tab, preset:ui.preset}})); } catch(e){} }, 400);
}
const get = k => (k in ui && !(k in state)) ? ui[k] : state[k];
function setVal(k, v){
  const prev = state[k];
  if (k === 'charsetPreset') { ui.charsetPreset = v; if (v !== 'custom') engine.set({charset: CHARSETS[v]}); }
  else if (UIKEYS.has(k)) { ui[k] = v; if (k === 'videoRate' && videoEl) videoEl.playbackRate = v; }
  else { engine.set({[k]: v}); if (k === 'charset') ui.charsetPreset = presetFor(v); }
  state = engine.get();
  if (!['paused','source','videoRate','videoMuted'].includes(k)) ui.preset = null;
  if (k === 'source' && v !== prev) onSourceChange(v, prev);
  refresh(); persist();
}
function applyPatch(p, presetName){
  engine.set(p); state = engine.get(); ui.charsetPreset = presetFor(state.charset); ui.preset = presetName || null; refresh(); persist();
}
const isMedia = s => s.source !== 'pattern';
const isFileMedia = s => ['image','video','camera'].includes(s.source);

/* ---------- fuentes ---------- */
function pickFile(kind){ const f = $('file'); f.accept = kind === 'video' ? 'video/*' : kind === 'image' ? 'image/*' : 'image/*,video/*'; f.value = ''; f.click(); }
$('file').addEventListener('change', e => loadFile(e.target.files[0]));
function loadFile(f){
  if (!f) return;
  if (f.type.startsWith('video/')) loadVideo(f);
  else if (f.type.startsWith('image/')) loadImage(f);
  else toast('Usa una imagen (JPG, PNG, WebP) o un video (MP4, WebM, MOV)');
}
function afterMediaLoad(kind, name){
  mediaNames[kind] = name;
  const patch = {source: kind};
  if (state.colorMode === 2) patch.colorMode = 3;
  const prev = state.source; engine.set(patch); state = engine.get();
  if (prev !== kind) onSourceChange(kind, prev, true);
  refresh(); persist();
}
async function loadImage(f){
  try { const bmp = await createImageBitmap(f); engine.setMedia(bmp, 'image'); afterMediaLoad('image', f.name); toast('Imagen cargada'); }
  catch(e){
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => { engine.setMedia(im, 'image'); afterMediaLoad('image', f.name); toast('Imagen cargada'); };
      im.onerror = () => toast('No se pudo abrir esa imagen. Prueba con JPG, PNG o WebP.'); im.src = r.result; };
    r.readAsDataURL(f);
  }
}
function loadVideo(f){
  if (videoEl) { videoEl.pause(); if (videoEl._url) URL.revokeObjectURL(videoEl._url); videoEl.remove(); }
  const v = document.createElement('video');
  v.muted = ui.videoMuted; v.loop = true; v.playsInline = true; v.setAttribute('playsinline',''); v.preload = 'auto';
  let triedData = false;
  v.addEventListener('loadeddata', () => {
    engine.setMedia(v, 'video'); v.playbackRate = ui.videoRate;
    v.play().catch(() => { v.muted = true; ui.videoMuted = true; v.play().catch(() => {}); });
    afterMediaLoad('video', f.name); toast('Video cargado');
  }, {once:true});
  v.addEventListener('play', refresh); v.addEventListener('pause', refresh);
  v.addEventListener('error', () => {
    if (!triedData && f.size < 150e6) { triedData = true; const r = new FileReader(); r.onload = () => { v.src = r.result; v.load(); }; r.readAsDataURL(f); }
    else toast('No se pudo reproducir ese video. Prueba con MP4 (H.264) o WebM.');
  });
  v._url = URL.createObjectURL(f); v.src = v._url; hiddenMount(v); videoEl = v;
}
async function startCamera(){
  if (camStream) { engine.setMedia(camEl, 'camera'); return; }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:1280}}, audio:false});
    camEl = document.createElement('video'); camEl.muted = true; camEl.playsInline = true; camEl.setAttribute('playsinline','');
    camEl.srcObject = camStream; hiddenMount(camEl); await camEl.play();
    engine.setMedia(camEl, 'camera'); mediaNames.camera = 'Cámara';
    if (!state.mirror) { engine.set({mirror:true}); state = engine.get(); }
    refresh();
  } catch(e){
    camStream = null;
    toast('No se pudo abrir la cámara. Revisa el permiso del navegador; en esta vista puede estar bloqueada.');
    refresh();
  }
}
function stopCamera(){ if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; if (camEl) { camEl.remove(); camEl = null; } engine.setMedia(null, 'camera'); }
function onSourceChange(v, prev, fromLoad){
  if (prev === 'camera' && v !== 'camera') stopCamera();
  if (prev === 'video' && v !== 'video' && videoEl) videoEl.pause();
  if (v === 'video' && videoEl && videoEl.paused) videoEl.play().catch(() => {});
  if (v === 'camera') startCamera();
  if (!fromLoad && (v === 'image' || v === 'video') && !engine.hasMedia(v)) pickFile(v);
}

/* ---------- export ---------- */
function exportPNG(){ engine.snapshot(blob => { if (!blob) { toast('No se pudo capturar la imagen'); return; } saveFile('ascii-'+stamp()+'.png', blob); }); }
function toggleRec(){
  if (rec) { rec.stop(); return; }
  const cv = $('cv');
  if (!cv.captureStream || !window.MediaRecorder) { toast('Este navegador no permite grabar el lienzo'); return; }
  const mt = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
  if (!mt) { toast('Este navegador no permite grabar el lienzo'); return; }
  const chunks = [];
  try { rec = new MediaRecorder(cv.captureStream(30), {mimeType:mt, videoBitsPerSecond:12e6}); }
  catch(e){ rec = null; toast('No se pudo iniciar la grabación'); return; }
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => { clearInterval(recTimer); const blob = new Blob(chunks, {type:mt}); rec = null; refresh();
    saveFile('ascii-'+stamp()+'.'+(mt.includes('mp4') ? 'mp4' : 'webm'), blob); };
  rec.start(250); recStart = Date.now(); recTimer = setInterval(refresh, 1000); refresh();
  toast('Grabando. Pulsa “Detener grabación” para guardar.');
}
function exportState(){ const s = engine.get(); delete s.mediaSrc; s.paused = false; return s; }
function embedCode(){
  const s = exportState(); let note = '';
  if (s.source === 'image' || s.source === 'video') { s.mediaSrc = s.source === 'video' ? 'mi-video.mp4' : 'mi-imagen.jpg';
    note = '<!-- Cambia "mediaSrc" por la ruta de tu archivo (mismo dominio, o servido con CORS). -->\n'; }
  if (s.source === 'camera') s.source = 'pattern';
  const json = JSON.stringify(s).replace(/</g,'\\u003c');
  return '<!-- Fondo ASCII animado (ASCII Shader Lab) -->\n' + note +
    '<div class="ascii-bg" style="position:fixed;inset:0;z-index:-1;pointer-events:none;background:'+s.bg+'">\n' +
    '  <canvas style="display:block;width:100%;height:100%"></canvas>\n</div>\n<script>\n(function(){\nvar ASCIIEngine = ' +
    ASCIIEngine.toString() + ';\nvar c = document.currentScript.previousElementSibling.querySelector("canvas");\nASCIIEngine(c, ' + json + ');\n})();\n<\/script>';
}
let dlgMode = 'embed';

    $('dlgTitle').textContent = 'Código para tu web';
    $('dlgNote').textContent = 'Pega esto dentro del <body>. Crea un canvas fijo detrás de tu contenido, sin librerías externas. Reacciona al cursor y se adapta al tamaño de pantalla.';
    $('dlgText').value = embedCode(); $('dlgText').readOnly = true; $('dlgAlt').textContent = 'Descargar .html';
  } else {
    $('dlgTitle').textContent = 'Ajustes en JSON';
    $('dlgNote').textContent = 'Copia estos ajustes para guardarlos, o pega unos anteriores y pulsa “Aplicar ajustes”.';
    $('dlgText').value = JSON.stringify(exportState(), null, 2); $('dlgText').readOnly = false; $('dlgAlt').textContent = 'Aplicar ajustes';
  }
  $('dlg').showModal();
}
$('dlgClose').onclick = () => $('dlg').close();
$('dlgCopy').onclick = async () => {
  const ta = $('dlgText');
  try { await navigator.clipboard.writeText(ta.value); toast('Copiado al portapapeles'); }
  catch(e){ ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    toast(ok ? 'Copiado al portapapeles' : 'Texto seleccionado: cópialo con Ctrl+C o Cmd+C'); }
};
$('dlgAlt').onclick = () => {
  if (dlgMode === 'embed') {
    const html = '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Fondo ASCII</title>\n</head>\n<body style="margin:0;min-height:100vh">\n' + embedCode() + '\n</body>\n</html>\n';
    saveFile('fondo-ascii.html', html);
  } else {
    try {
      const obj = JSON.parse($('dlgText').value); if (!obj || typeof obj !== 'object') throw 0;
      const defs = engine.defaults(), p = {};
      for (const k in obj) if (k in defs && typeof obj[k] === typeof defs[k] && k !== 'mediaSrc') p[k] = obj[k];
      if (['image','video','camera'].includes(p.source) && !engine.hasMedia(p.source)) delete p.source;
      applyPatch(p); $('dlg').close(); toast('Ajustes aplicados');
    } catch(e){ toast('El JSON no es válido. Revisa comas y comillas.'); }
  }
};
function resetAll(){

  applyPatch(Object.assign(engine.defaults(), PRESET_BASE, PRESETS[0].s, {source:'pattern'}), 'Nebulosa');
  if (prev !== 'pattern') onSourceChange('pattern', prev);
  toast('Todo restablecido');
}
function randomize(){
  const R = Math.random, pick = a => a[Math.floor(R()*a.length)], h = Math.floor(R()*360), m = isMedia(state), r2 = v => Math.round(v*100)/100;
  const p = {patA:Math.floor(R()*16), patB:R()<.35 ? -1 : Math.floor(R()*16), blend:Math.floor(R()*8), mix:r2(.35+R()*.65),
    scale:r2(.6+R()*1.6), scaleB:r2(.4+R()*1.8), speed:r2(.3+R()*1.3), speedB:r2(.4+R()*1.6), rot:R()<.5 ? 0 : Math.floor(R()*360), warp:R()<.45 ? 0 : r2(R()*.9),
    charset:CHARSETS[pick(['clasico','detallado','bloques','puntos','binario','matrix','hex','simbolos'])], cell:pick([7,8,9,10,11,12,14]),
    colorMode:m ? pick([3,3,0,1]) : pick([0,1,1,2,2]), colA:hsl(h,80,72), colB:hsl((h+pick([30,150,200]))%360,70,18), bg:hsl((h+180)%360,40,4),
    hue:r2(R()), cycle:R()<.3 ? r2(R()*.08) : 0, glow:r2(R()*.6), edge:R()<.2 ? r2(.4+R()*.4) : 0, contrast:r2(.9+R()*.5), bright:0, gamma:1,
    invert:false, scan:R()<.2 ? r2(R()*.6) : 0, vig:r2(R()*.5), cellBg:R()<.2 ? r2(R()*.3) : 0, dither:R()<.3 ? .5 : 0};

  const lab = el('span',{class:'lbl'});
  if (it.t === 'range') {
    const out = el('output'), inp = el('input',{type:'range',min:it.min,max:it.max,step:it.step || .01});
    inp.addEventListener('input', () => setVal(it.k, parseFloat(inp.value)));
    root = el('label',{class:'ctl'},[lab,out,inp]);
    update = () => { lab.textContent = lblOf(it); const v = get(it.k); if (document.activeElement !== inp) inp.value = v; out.textContent = fmt(it, v); };
  } else if (it.t === 'select') {
    const sel = el('select'); it.opts.forEach((o,i) => sel.appendChild(el('option',{value:i,text:o[1]})));
    sel.addEventListener('change', () => setVal(it.k, it.opts[+sel.value][0]));
    root = el('label',{class:'ctl'},[lab,sel]);
    update = () => { lab.textContent = lblOf(it); const i = it.opts.findIndex(o => o[0] === get(it.k)); sel.value = String(Math.max(0,i)); };
  } else if (it.t === 'seg') {
    const box = el('div',{class:'seg',role:'group'});
    const btns = it.opts.map(o => { const b = el('button',{type:'button',text:o[1]}); b.addEventListener('click', () => setVal(it.k, o[0])); box.appendChild(b); return b; });
    root = el('div',{class:'ctl'},[lab,box]);
    update = () => { lab.textContent = lblOf(it); box.setAttribute('aria-label', lblOf(it)); btns.forEach((b,i) => b.setAttribute('aria-pressed', String(it.opts[i][0] === get(it.k)))); };
  } else if (it.t === 'toggle') {
    const inp = el('input',{type:'checkbox',role:'switch'}); inp.addEventListener('change', () => setVal(it.k, inp.checked));
    root = el('label',{class:'ctl toggle'},[lab,inp]);
    update = () => { lab.textContent = lblOf(it); inp.checked = !!get(it.k); };
  } else if (it.t === 'color') {
    const inp = el('input',{type:'color'}), hex = el('output');
    inp.addEventListener('input', () => setVal(it.k, inp.value));
    root = el('label',{class:'ctl color'},[lab, el('span',{class:'sw'},[hex,inp])]);
    update = () => { lab.textContent = lblOf(it); const v = String(get(it.k)); if (document.activeElement !== inp) inp.value = v; hex.textContent = v.toUpperCase(); };
  } else if (it.t === 'text' || it.t === 'textarea') {
    const inp = it.t === 'text' ? el('input',{type:'text',spellcheck:'false',autocomplete:'off'}) : el('textarea',{rows:'3',spellcheck:'false'});
    inp.addEventListener('input', () => setVal(it.k, inp.value));
    root = el('label',{class:'ctl'},[lab,inp]);
    update = () => { lab.textContent = lblOf(it); if (document.activeElement !== inp) inp.value = get(it.k); };
  } else if (it.t === 'h') { root = el('h3',{class:'sub'}); update = () => { root.textContent = lblOf(it); }; }
  else if (it.t === 'note') { root = el('p',{class:'note'}); update = () => { root.textContent = lblOf(it); }; }
  else if (it.t === 'custom') { const r = it.render(); root = r.root; update = r.update || update; }
  ctls.push({it, root, update});
  return root;
}
TABDEF.forEach(tab => {
  const b = el('button',{class:'tab',type:'button',role:'tab',text:tab.name}); b.dataset.id = tab.id;
  b.onclick = () => showTab(tab.id); $('tabs').appendChild(b); tabBtns.push(b);
  const pane = el('div',{role:'tabpanel','aria-label':tab.name}); tab.items.forEach(it => pane.appendChild(build(it)));
  $('panes').appendChild(pane); panes[tab.id] = pane;
});
function showTab(id){ if (!panes[id]) id = 'fuente'; ui.tab = id; tabBtns.forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === id)));
  for (const p in panes) panes[p].hidden = p !== id; $('panes').scrollTop = 0; persist(); }

const chips = PRESETS.map(p => { const c = el('button',{class:'chip',type:'button',text:p.name});
  c.onclick = () => applyPatch(Object.assign({}, PRESET_BASE, p.s), p.name); $('presets').appendChild(c); return c; });

const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>Pausar</span>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg><span>Reanudar</span>';
function refresh(){
  ctls.forEach(c => { const vis = !c.it.show || c.it.show(state); c.root.hidden = !vis; if (vis) c.update(); });
  chips.forEach((c,i) => c.setAttribute('aria-pressed', String(PRESETS[i].name === ui.preset)));
  $('bPause').innerHTML = state.paused ? ICON_PLAY : ICON_PAUSE;
  $('bPause').title = state.paused ? 'Reanudar animación (Espacio)' : 'Pausar animación (Espacio)';
  const src = state.source, need = isFileMedia(state) && !engine.hasMedia(src) && !(src === 'camera' && camStream);
  $('empty').hidden = !need;
  if (need) {
    $('emptyMsg').textContent = src === 'camera' ? 'Activa la cámara para convertirla en ASCII en vivo.' : src === 'video' ? 'Suelta aquí un video o elige uno de tu equipo.' : 'Suelta aquí una imagen o elige una de tu equipo.';
    $('emptyBtn').textContent = src === 'camera' ? 'Activar cámara' : src === 'video' ? 'Elegir video' : 'Elegir imagen';
  }
}
$('emptyBtn').onclick = () => { if (state.source === 'camera') startCamera(); else pickFile(state.source); };

/* ---------- barra y atajos ---------- */
const togglePause = () => setVal('paused', !state.paused);
const togglePanel = () => document.body.classList.toggle('panel-off');
function toggleFull(){
  const d = document, de = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const fn = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!fn) throw 0;
    const r = fn.call(de); if (r && r.catch) r.catch(() => toast('Pantalla completa no disponible aquí. Oculta el panel con H.'));
  } catch(e){ toast('Pantalla completa no disponible aquí. Oculta el panel con H.'); }
}
$('bRand').onclick = randomize; $('bPause').onclick = togglePause; $('bPanel').onclick = togglePanel; $('bFull').onclick = toggleFull;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || $('dlg').open) return;
  const t = e.target;
  if (t.closest && t.closest('input,textarea,select')) return;
  if (e.key === ' ') { if (t.closest && t.closest('button')) return; e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') randomize();
  else if (e.key === 'h' || e.key === 'H') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
});

/* ---------- arrastrar y soltar ---------- */
let dragDepth = 0;
addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth-1); if (!dragDepth) document.body.classList.remove('dragging'); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });

setInterval(() => { const i = engine.info(); $('stats').textContent = i.cols + '×' + i.rows + ' celdas, ' + i.fps + ' fps'; }, 500);
showTab(ui.tab);
refresh();
})();
</script>
</body>
</html>
