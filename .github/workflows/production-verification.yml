name: Verificación de producción
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deployed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Esperar el HTML del commit integrado
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const expected = await readFile('dist/studio/index.html', 'utf8');
          let matched = false;
          for (let i = 0; i < 40; i++) {
            const response = await fetch('https://glyphos-ascii.vercel.app/studio/', { cache: 'no-store', signal: AbortSignal.timeout(15000) });
            if (response.ok && await response.text() === expected) { matched = true; break; }
            console.log('Esperando el build de', process.env.GITHUB_SHA, 'intento', i + 1);
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          if (!matched) throw new Error('Producción no sirve el HTML del commit integrado');
          console.log('HTML de producción idéntico al build de', process.env.GITHUB_SHA);
          JS
      - name: Rutas, cabeceras y ausencia de ORT público
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { writeFile, readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const base = 'https://glyphos-ascii.vercel.app';
          const rows = [];
          const config = JSON.parse(await readFile('vercel.json', 'utf8'));
          const globalHeaders = config.headers.find(rule => rule.source === '/(.*)').headers;
          const routes = ['/', '/studio/', '/ver/', '/imagen-a-ascii/', '/video-a-ascii/', '/fondos-ascii/', '/texto-animado-ascii/', '/arte-ascii-terminal/', '/licencia/', '/studio/foto/'];
          for (const path of routes) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(15000) });
            const headers = Object.fromEntries(response.headers);
            assert.equal(response.status, 200, path);
            for (const header of globalHeaders) assert.equal(headers[header.key.toLowerCase()], header.value, path + ': ' + header.key);
            assert.equal(headers['x-content-type-options'], 'nosniff', path);
            assert.equal(headers['x-frame-options'], 'SAMEORIGIN', path);
            assert.match(headers['content-security-policy'] ?? '', /default-src 'self'/, path);
            assert.match(headers['permissions-policy'] ?? '', /camera=\(self\)/, path);
            assert.match(headers['permissions-policy'] ?? '', /microphone=\(self\)/, path);
            assert.match(headers['cache-control'] ?? '', /max-age=0/, path);
            assert.match(headers['cache-control'] ?? '', /must-revalidate/, path);
            if (path === '/studio/foto/') {
              assert.equal(headers['cross-origin-opener-policy'], 'same-origin');
              assert.equal(headers['cross-origin-embedder-policy'], 'require-corp');
              assert.match(await response.text(), /noindex/);
            }
            rows.push({ path, status: response.status, headers });
          }
          for (const path of ['/esta-pagina-no-existe/', '/dev/timeline.html', '/legacy/', '/ort/1.30.0/ort-wasm-simd-threaded.wasm']) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(15000) });
            assert.equal(response.status, 404, path);
            assert.match(await response.text(), /noindex/, path);
            rows.push({ path, status: response.status });
          }
          for (const path of ['/studio', '/ver', '/imagen-a-ascii', '/index.html']) {
            const response = await fetch(base + path, { redirect: 'manual', signal: AbortSignal.timeout(15000) });
            assert.equal(response.status, 308, path);
            rows.push({ path, status: response.status, location: response.headers.get('location') });
          }
          const html = await readFile('dist/studio/index.html', 'utf8');
          const asset = html.match(/src="(\/assets\/studio-[^"]+\.js)"/)?.[1];
          assert.ok(asset, 'Chunk studio con hash');
          const response = await fetch(base + asset, { signal: AbortSignal.timeout(15000) });
          assert.equal(response.status, 200);
          assert.match(response.headers.get('cache-control') ?? '', /immutable/);
          assert.match(response.headers.get('cache-control') ?? '', /max-age=31536000/);
          const hash = data => createHash('sha256').update(data).digest('hex');
          const sha256 = hash(Buffer.from(await response.arrayBuffer()));
          assert.equal(sha256, hash(await readFile('dist' + asset)), 'Código de producción idéntico al build');
          rows.push({ path: asset, status: response.status, cache: response.headers.get('cache-control'), sha256 });
          await writeFile('production-headers.json', JSON.stringify({ commit: process.env.GITHUB_SHA, rows }, null, 2));
          console.log('Rutas y cabeceras verificadas:', rows.length);
          JS
      - run: npx playwright install --with-deps chromium
      - name: Datos, recuperación, fuentes, legibilidad, compartir y SEO en producción
        env:
          BASE_URL: https://glyphos-ascii.vercel.app
          PLAYWRIGHT_JSON_OUTPUT_FILE: production-results.json
        run: npx playwright test tests/e2e/data.spec.ts tests/e2e/urgent-recovery.spec.ts tests/e2e/reaudit-additional.spec.ts tests/e2e/legibility.spec.ts tests/e2e/compartir.spec.ts tests/e2e/seo.spec.ts --project=desktop --workers=1 --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: |
            production-results.json
            production-headers.json
            test-results
          retention-days: 30
