<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QA · biblioteca de animación</title>
<style>
:root{color-scheme:dark;--ink:#0c0b0a;--ink2:#151412;--ink3:#1e1c19;--line:#2a2723;--smoke:#8c857a;--bone:#ede6da;--signal:#ff5b1f}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font:13px/1.45 system-ui,sans-serif}
header.top{position:sticky;top:0;z-index:2;background:rgba(12,11,10,.94);backdrop-filter:blur(6px);padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header.top b{font:600 15px/1.2 ui-monospace,monospace;letter-spacing:.02em}
#status{color:var(--smoke);font-family:ui-monospace,monospace;font-size:12px}
header.top label{display:flex;gap:8px;align-items:center;color:var(--smoke)}
select,button,input{font:inherit;color:inherit}
select,button{min-height:36px;background:var(--ink3);border:1px solid var(--line);border-radius:8px;padding:0 10px}
button[aria-pressed="true"]{border-color:var(--signal);color:#fff;box-shadow:inset 0 0 0 1px var(--signal)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
main{padding:6px 16px 40px}
h2{font:600 12px/1.2 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--smoke);margin:22px 0 10px;border-top:1px solid var(--line);padding-top:14px}
h2 small{letter-spacing:0;text-transform:none;font-weight:400;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card header{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.card header b{font-size:14px}
.card header code{color:var(--smoke);font-size:11px}
.card header .kinds{margin-left:auto;color:var(--smoke);font-size:11px;font-family:ui-monospace,monospace}
.card canvas.main{display:block;width:100%;height:auto;aspect-ratio:8/5;background:repeating-conic-gradient(#1e1c19 0 25%,#171614 0 50%) 0 0/14px 14px;border-radius:6px}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button{min-width:44px;min-height:44px}
.ctl input[type=range]{flex:1;min-width:0;min-height:44px;accent-color:var(--signal)}
.ctl output{font:12px ui-monospace,monospace;color:var(--smoke);min-width:4.5em;text-align:right}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.strip figure{margin:0}
.strip canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;border-radius:3px;background:#171614}
.strip figcaption{font:10px ui-monospace,monospace;color:var(--smoke);text-align:center;padding-top:2px}
.blurb{margin:0;color:#cfc7ba;font-size:12px}
.warn{color:#ff9f6b;font-size:12px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head>
<body>
<header class="top">
  <b>Biblioteca de animación</b>
  <label>Tipo de capa <select id="kind"><option value="auto">El que mejor le va</option><option value="glyphs">Caracteres</option><option value="ascii">ASCII</option><option value="photo">Foto</option><option value="text">Texto</option><option value="shape">Forma</option></select></label>
  <span id="status">preparando…</span>
</header>
<main id="groups"></main>
<script type="module" src="./anim.ts"></script>
</body></html>
