<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>glyphs · QA</title>
<style>
  :root{--ink:#0c0b0a;--bone:#ede6da;--line:#2a2723;--mute:#8a8378;--ver:#ff5b1f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--bone);font:13px/1.4 system-ui,sans-serif}
  header{background:var(--ink);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end}
  header b{font:600 14px/1 ui-monospace,monospace;letter-spacing:.08em;margin-right:6px;align-self:center}
  label{display:grid;gap:3px;font-size:11px;color:var(--mute)}
  label.row{display:flex;align-items:center;gap:6px;min-height:28px}
  input[type=range]{width:110px;accent-color:var(--ver)}
  select,textarea,button{font:inherit;color:var(--bone);background:#1b1916;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
  textarea{width:220px;height:30px;resize:vertical}
  button{cursor:pointer;min-height:30px}
  output{font:11px ui-monospace,monospace;color:var(--bone)}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:14px}
  .pane{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#1a1816 0 25%,#141210 0 50%) 0 0/16px 16px}
  .pane h2{margin:0;padding:6px 10px;font:600 11px/1.4 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:var(--ink);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
  #view{display:block;width:100%;height:auto}
  pre#text{margin:0;padding:8px;font:6px/1 "JetBrains Mono",ui-monospace,monospace;font-variant-ligatures:none;color:var(--bone);background:var(--ink);overflow:auto;max-height:80vh;white-space:pre}
  #stats{padding:0 14px;font:11px ui-monospace,monospace;color:var(--mute)}
  section.all{padding:0 14px 30px}
  section.all h2{font:600 12px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--ink)}
  figure canvas{display:block;width:100%;height:auto}
  figcaption{padding:6px 8px;font-size:11px;color:var(--mute)}
  figcaption b{color:var(--bone);font-weight:600}
  @media (max-width:760px){main{grid-template-columns:1fr}header{gap:6px 10px}input[type=range]{width:90px}}
  figcaption code{display:block;margin-top:3px;font:10px ui-monospace,monospace;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body>
<header id="controls"><b>GLYPHOS · caracteres reales</b></header>
<div id="stats"></div>
<main>
  <div class="pane"><h2><span>Render (canvas)</span><span id="dims"></span></h2><canvas id="view"></canvas></div>
  <div class="pane"><h2><span>Texto copiable</span><button id="copy" type="button">Copiar como texto</button></h2><pre id="text"></pre></div>
</main>
<section class="all"><h2>Todos los alfabetos · misma imagen</h2><div class="grid" id="all"></div></section>
<script type="module" src="./glyphs.ts"></script>
</body></html>
