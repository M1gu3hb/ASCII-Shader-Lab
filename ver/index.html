<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- @head -->
<style>
html,body{background:#0c0b0a;margin:0;height:100%}
/* Until the piece is read: system fonts only, nothing that moves the layout when the viewer takes over. */
.ver-boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#0c0b0a;color:#ede6da;font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.ver-boot h1{margin:0 0 12px;font:700 20px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ver-boot p{margin:0 0 10px;color:#a39c90}
.ver-boot .ver-boot-load{display:flex;align-items:center;justify-content:center;gap:12px;font:500 12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8c857a}
.ver-boot-bar{position:relative;width:96px;height:2px;overflow:hidden;background:rgba(237,230,218,.14)}
.ver-boot-bar::after{content:"";position:absolute;inset:0;width:40%;background:#ff5b1f;animation:verboot 1.1s cubic-bezier(.7,0,.2,1) infinite alternate}
@keyframes verboot{to{transform:translateX(150%)}}
.ver-boot a{color:#ede6da;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.ver-boot-bar::after{animation:none;width:100%;opacity:.5}}
</style>
<noscript><style>.ver-boot-load{display:none!important}</style></noscript>
</head>
<body>
<div id="ver">
  <main class="ver-boot">
    <div>
      <h1>Una pieza de arte ASCII hecha con GLYPHOS</h1>
      <p class="ver-boot-load" role="status"><span class="ver-boot-bar" aria-hidden="true"></span>Cargando la pieza…</p>
      <noscript><p>Para ver la pieza hace falta JavaScript. <a href="/">Ir a GLYPHOS</a></p></noscript>
    </div>
  </main>
</div>
<script type="module" src="/src/ver/main.ts"></script>
</body>
</html>
